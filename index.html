<style>

.bar{display:flex}

.it.r0{border-left:5px solid #d92d20}.it.r1{border-left:5px solid #f5a623}.it.r2{border-left:5px solid #1a9e4b}.it.rn{border-left:5px solid transparent}

body.hc .sg input:checked+span{outline:3px solid #000}

/* ---- LCARS-inspired look in POPS colours (restrained) ---- */
:root{--navy:#001b50;--teal:#01a48d;--teal2:#7fd6c8;--navy2:#c9d6ee;--navy3:#e9eef8}
header{position:relative;background:#fff;border-bottom:0;padding:0 0 10px}
header::before{content:"";display:block;height:14px;background:linear-gradient(90deg,var(--teal) 0 22%,#fff 22% 22.6%,var(--navy) 22.6% 58%,#fff 58% 58.6%,var(--teal2) 58.6% 74%,#fff 74% 74.6%,var(--navy2) 74.6% 100%);border-radius:0 0 18px 0}
header::after{content:"";display:block;height:8px;margin-top:10px;background:linear-gradient(90deg,var(--navy) 0 14%,#fff 14% 14.6%,var(--teal) 14.6% 100%);border-radius:0 18px 18px 0;width:min(100%,96%)}
.hd{padding-top:10px}
.hd>div h1{text-transform:uppercase;letter-spacing:.09em;font-size:1.15em;font-weight:700;color:var(--navy)}
.hd img{background:#fff}
nav{gap:4px}
nav button,.tabrow button{flex:0 0 auto;min-width:0;white-space:nowrap}.tools{flex:0 0 auto;justify-content:flex-start}.tools button{flex:0 0 auto}
nav button,.tabrow button{border:0;border-radius:99px;background:var(--navy3);color:var(--navy);text-transform:uppercase;letter-spacing:.05em;font-size:.82em;font-weight:700;padding:9px 18px}
nav button:hover,.tabrow button:hover{background:var(--navy2)}
nav button.on,.tabrow button.on{background:var(--teal);color:#fff}
nav button.ghost,.utilrow button.ghost,.tools button.ghost{background:transparent;color:var(--navy);text-transform:none;letter-spacing:0;font-weight:600;border:2px solid var(--navy2)}
nav button.ghost:hover{background:var(--navy3)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;font-size:.88em}
button.primary:hover{background:var(--teal);border-color:var(--teal)}
button:not(.small):not(.primary):not(.ghost):not([data-tab]){border-radius:99px}
.card{border-radius:30px 12px 12px 12px;border-left:12px solid var(--teal);padding-left:18px;background:#fff}
.card:nth-of-type(even){border-left-color:var(--navy)}
.card>h2:first-child,#v h2{text-transform:uppercase;letter-spacing:.07em;font-size:1.02em;color:var(--navy)}
.card>h2:first-child::after{content:"";display:block;height:5px;width:64px;margin-top:6px;border-radius:99px;background:linear-gradient(90deg,var(--teal) 0 60%,var(--navy2) 60%)}
.cat{border-radius:22px 10px 10px 10px}.cat>div.h{background:var(--navy3);color:var(--navy);text-transform:uppercase;letter-spacing:.05em;font-size:.88em}
.it{border-top-color:var(--navy3)}
.note{border-radius:18px 8px 8px 8px}
.kpi div{border-radius:16px 6px 6px 6px;border-left:5px solid var(--teal)}
.stick.card{border-left-width:12px}
th{background:var(--navy3);color:var(--navy)}
.sitef{background:var(--navy);color:#fff;border-top:0;border-radius:36px 0 0 0;padding:18px 20px 30px;margin-top:30px}.sitef b,.sitef{color:#fff}.sitef a{color:var(--teal2)}
#report{border-radius:30px 12px 12px 12px;border-left:12px solid var(--teal)}
#report h2{border:0;background:var(--navy3);color:var(--navy);border-radius:99px 8px 8px 99px;padding:5px 16px;text-transform:uppercase;letter-spacing:.05em;font-size:.98em;position:relative}
#report .main h2{margin-top:0}

@media(max-width:640px){header::before{height:10px}.hd>div h1{font-size:.95em;letter-spacing:.06em}.card{border-left-width:9px;padding-left:12px;border-radius:24px 10px 10px 10px}nav button,.tabrow button{padding:8px 14px}}
@media print{header,.sitef{display:none!important}.card,#report{border-left:0;border-radius:0}#report h2{background:none;border-bottom:2px solid var(--teal);border-radius:0;padding:3px 0;color:var(--navy)}#report .apph{background:none;color:var(--navy);border:2px solid var(--navy);border-radius:0}}

<body>
<header><div class="wrap hd"><img data-logo alt="Positive Outcomes Psychology Service logo"><div><h1>POPS Human Figure Profile</h1>
<p>Everything stays in this browser. Nothing is uploaded or sent anywhere.</p></div></div></header>
<div class="wrap">
 <nav id="tabs"></nav>
 <main id="v"></main>
</div>
<div id="lb" role="dialog" aria-label="Drawing enlarged"><img alt="Drawing enlarged" id="lbi"></div>
<input type="file" id="casefile" accept=".json,application/json" hidden>
<footer class="wrap sitef"><b>Positive Outcomes Psychology Service (POPS UK)</b><br>Offering bespoke psychological services in education: seeing learning through the learner's eyes.<br><a href="mailto:popsUKoffice@gmail.com">popsUKoffice@gmail.com</a><br><span id="cpy"></span></footer>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Developmental features checklist (project-authored, indicative; NOT the published item list) ----------
   D(label, "clear = count when…", "partial / do-not-count rules", flags)  flags: m = motor-sensitive fine detail, t = affected by tadpole-style figures */
const D=(t,c,n,f)=>({t,c,n:n||'',f:f||''});
const CL=[
 {k:'face',t:'Head and face',items:[
  D('Head drawn as a distinct shape','A closed or nearly closed shape that is clearly the head. In a tadpole figure the circle counts as the head.','Partial: an unclear or very open outline where the head can still be identified.'),
  D('Eyes shown','Two eyes (or one in a side view) drawn as dots, marks or shapes in the face.','Partial: one eye in a front view, or marks that may be eyes but are unclear.'),
  D('Pupils or irises shown','A dot or fill inside a drawn eye outline.','A lone dot with no eye outline is the eye, not a pupil. Partial: pupil in one eye only.','m'),
  D('Eyebrows shown','Separate marks or lines above the eyes.','Partial: one eyebrow, or a line touching the eye outline.'),
  D('Eyelashes shown','Short marks along the edge of an eye.','Partial: lashes on one eye only.','m'),
  D('Nose shown','Any mark in the central face intended as a nose (dot, line, L-shape, triangle).','Partial: nose and mouth merged or unclear.'),
  D('Nose has shape (nostrils, bridge or tip)','Nostrils, a clear bridge or tip, or an outlined nose.','A single dot or line is "nose shown" only.','m'),
  D('Mouth shown','A line, curve or shape in the lower face.','Partial: a mark that could be a mouth or a nose.'),
  D('Lips shown as a shaped mouth','Upper and lower lip visible, or a filled or closed mouth shape.','A single line or curve is a mouth, not lips.','m'),
  D('Ears shown','One or two ears at the sides of the head (one in a side view).','Partial: unclear marks at the side of the head.'),
  D('Chin or jaw shaped','The lower head outline is shaped or marked to show a chin or jaw.','A plain circle with no chin shaping does not count.','m')]},
 {k:'hair',t:'Hair and head covering',items:[
  D('Hair shown','Any hair marks or fill on the top or sides of the head.','Scribbling over the whole face is not hair.'),
  D('Hair has style or direction','Strands, parting, fringe, plait, curls, tied hair or other clear styling.','Partial: a mass of hair with only a hint of strands.'),
  D('Hat, cap or other head covering','A hat, cap, hood, scarf, hijab or similar covering.','')]},
 {k:'body',t:'Trunk and neck',items:[
  D('Neck shown','A visible link between head and trunk, narrower than the head.','Head touching the trunk directly is absent. Tadpole figures are usually absent.','t'),
  D('Trunk drawn as a distinct shape','A separate body shape between head and legs.','Tadpole figure: absent. Partial: a body region that is only just identifiable.','t'),
  D('Trunk is longer than it is wide','Trunk height clearly greater than its widest point.','Judge from the drawing, not from a measurement tool. Partial: roughly square.','t'),
  D('Shoulders shown','A shoulder slope or line, or arms leaving a clearly marked shoulder.','Arms drawn straight out of a rectangle are absent.','t'),
  D('Waist or hips shown','The body narrows at a waist, widens at hips, or a waist or hip line is marked.','A belt alone does not count.','t')]},
 {k:'arms',t:'Arms and hands',items:[
  D('Two arms shown','Two arms drawn (one may be hidden in a side view).','Partial: one arm in a front view.'),
  D('Arms attached at the shoulder area','Arms join at the upper trunk or shoulder.','Arms from the head (tadpole) or from the middle of the trunk are absent or partial. Do not assume what was meant.','t'),
  D('Arms drawn with two lines','Each arm shown as an area with two outline lines.','Partial: one arm with two lines, the other a single line.'),
  D('Hands shown','A hand shape, mitten or fingers at the end of each arm.','Partial: one hand only, or a widened end with no hand shape.'),
  D('Fingers shown','Separate finger lines or shapes.','Partial: fingers on one hand only.','m'),
  D('Fingers roughly the correct number (five)','Count the fingers on each hand separately. Clear: both hands show five fingers, or a thumb plus four.','Partial: only one hand has the correct number (the other has a different number, or no fingers or no hand). Absent: neither hand has the correct number, or no fingers are drawn.','m'),
  D('Thumb distinct from fingers','A thumb clearly set apart from the fingers.','Partial: one hand only.','m'),
  D('Elbow bend shown','An angle or bend in an arm.','A gentle curve with no joint is absent.')]},
 {k:'legs',t:'Legs and feet',items:[
  D('Two legs shown','Two legs drawn (one may be hidden in a side view).','Partial: one leg in a front view.'),
  D('Legs attached at the lower trunk','Legs join the bottom of the trunk or the hip area.','Legs from the head (tadpole) are absent or partial. Do not assume what was meant.','t'),
  D('Legs drawn with two lines','Each leg shown as an area with two outline lines.','Partial: one leg with two lines, the other a single line.'),
  D('Feet shown','A foot shape or shoe at the end of each leg.','Partial: one foot only, or a leg end with a tick mark.'),
  D('Feet have shape or direction','Toes, heel or a shoe shape beyond a simple line; feet point in a direction.','Partial: one foot only.','m'),
  D('Knee bend shown','An angle or bend in a leg.','A gentle curve with no joint is absent.')]},
 {k:'cloth',t:'Clothing',items:[
  D('Some clothing shown','Look for any garment on the body: a top, trousers, skirt, dress, shoes or a hat. A garment can be drawn in outline, coloured in or shaded, as long as it clearly covers part of the body.','Partial: only lines or marks across the body, with no clear garment shape. Absent: the body is left as a plain outline with nothing added.'),
  D('Two or more clothing items','At least two separate items (for example top and trousers, or dress and shoes).','Partial: one item plus an unclear second.'),
  D('Top and lower clothing clearly different','A clear difference between upper and lower garments.','A single dress with no break is absent.'),
  D('Sleeves shown','Sleeve outlines, cuffs or a clear sleeve edge.','Partial: unclear.'),
  D('Collar, buttons, zip or fastening shown','Any small fastening or neckline detail.','Partial: marks that might be buttons.','m'),
  D('Pockets or belt shown','A pocket outline or a belt.','Partial: unclear.','m'),
  D('Shoe or sock detail','Laces, soles, stripes or socks.','Simple shoe shapes alone do not count.','m')]},
 {k:'prop',t:'Proportion and organisation',items:[
  D('Head size plausible for the body','Head is roughly between one-eighth and one-third of whole figure height. This is a rule of thumb for this tool, not a published norm.','Partial: just outside that range.'),
  D('Arm length plausible','Arms are similar to each other, and are neither tiny stubs nor longer than the legs.','Partial: one arm clearly different.'),
  D('Leg length plausible','Legs are at least about as long as the trunk and not stubs.','Partial: one leg clearly different.'),
  D('Figure roughly symmetrical','Left and right sides are broadly matched in size and position.','Judge the overall impression.','m'),
  D('Features placed in sensible positions','Eyes above nose above mouth; ears at the sides; arms at the upper trunk; legs at the lower trunk.','Partial: one or two parts clearly misplaced.'),
  D('Whole figure drawn and complete','Head, trunk, arms and legs all drawn, and the figure is not cut off.','Check the original page if a photo crops the figure.'),
  D('Lines fluent and controlled','Lines are generally smooth and purposeful, with joins mostly closed and little overdrawing.','Partial: some control but many gaps or overlaps.','m'),
  D('Body parts not showing through clothing','Limbs and body lines are not visible through drawn clothes.','Absent if no clothing is drawn. Not scoreable evidence otherwise.'),
  D('Profile or part-profile shown','Head or body in side view, or feet and nose turned sideways.','Partial: only the feet, or only the nose.'),
  D('Movement or action shown','Posture shows an action such as running, waving or kicking.','A stiff, straight pose is absent.'),
  D('Ground line or setting','A ground line, or the figure placed in a setting.','Partial: a few marks around the figure.'),
  D('Accessory or held object','A bag, ball, tool, pet or similar.','Partial: unclear object.')]}
];

function vStart(){
$('#v').innerHTML=`<div class="card"><h2>Start here: how to use the POPS Human Figure Profile</h2>
<p>This tool helps you score a child's drawing of a person against a checklist of developmental features, compare the drawing with what is typical for the child's age, and produce a report you can save, print or email. Allow about 10 minutes for the drawing and 10 to 15 minutes to score it.</p>
<div class="note"><b>Who it is for.</b> It is intended for educational psychologists and other trained practitioners. It describes how developed a drawing is for the child's age. It is <b>not an IQ test, not a measure of emotional wellbeing and not a diagnostic tool</b>. Use it with other evidence, and never on its own to make a decision about a child. Everything you enter stays in this browser. Nothing is uploaded or sent anywhere.</div></div>

<div class="card"><h2>1. What you need</h2><ul>
<li><b>Plain white A4 paper</b>, unlined and unmarked, one sheet for each attempt. Place it <b>portrait</b> (upright) in front of the child, centred. The space and placement measures assume A4 portrait.</li>
<li><b>A sharpened pencil</b> (HB or 2B). Have a <b>rubber</b> to hand, but give one only if the child asks.</li>
<li><b>A table and chair of a suitable height</b> in a quiet place, with the child's glasses on if they wear them.</li>
<li><b>Nothing showing people or body parts</b> in the child's view: no posters, books, dolls or other children's drawings.</li>
<li><b>A clock or timer</b> to note how long the child takes, and somewhere to write notes.</li>
<li><b>A phone camera or scanner</b> to capture the finished drawing (see step 4).</li>
<li>If the child speaks another language at home, <b>an interpreter or the instruction in their home language</b>.</li></ul></div>

<div class="card"><h2>2. Before you start</h2><ul>
<li>Check that the child is willing, comfortable and not tired, hungry or upset. This is a drawing task, not a test to be won, so there is no need to explain what it measures.</li>
<li>Note the <b>hand</b> the child uses. Let a left-handed child angle the paper as they prefer.</li>
<li>Decide which figure the child will be asked to draw (a man, a woman, or themselves) and keep to the same choice each time so that cases can be compared. If you are building a local sample, use the same one throughout.</li>
<li>Write the date of birth and the date of the task, which the tool uses to work out the child's age.</li></ul></div>

<div class="card"><h2>3. What to say to the child</h2>
<p>Read one of the following in a friendly, even voice. Say it the same way every time and do not add to it.</p>
<div class="note" style="font-size:1.05em"><p style="margin:4px 0"><b>Man:</b> "Please draw a picture of a man. Take your time and do the best drawing you can."</p>
<p style="margin:4px 0"><b>Woman:</b> "Please draw a picture of a woman. Take your time and do the best drawing you can."</p>
<p style="margin:4px 0"><b>Self:</b> "Please draw a picture of yourself. Take your time and do the best drawing you can."</p></div>
<h3>No prompts, hints or help</h3>
<p>The drawing only shows what the child can do unaided if the examiner gives no guidance. During the task:</p>
<ul>
<li><b>Do not</b> name, point to or ask about any body part (for example "what about arms?" or "does he have feet?").</li>
<li><b>Do not</b> say how many parts to draw, show an example, draw anything yourself, or correct the child's drawing.</li>
<li><b>Do not</b> praise or criticise any particular part. Keep your reactions neutral and brief.</li>
<li><b>Do not</b> comment when the child rubs something out or starts again. Just note it.</li>
<li><b>If the child asks what to do</b>, say: "Draw however you think is best."</li>
<li><b>If the child says they cannot draw</b>, say: "Just do the best you can."</li>
<li><b>If the child asks whether they may use the rubber or start again</b>, say yes, and give them a second sheet if needed. Keep every sheet.</li>
<li><b>If the child stops</b>, wait quietly for a moment, then ask only: "Have you finished?" Do not suggest that anything is missing.</li>
<li>There is no strict time limit. If the child is still working after about 15 minutes you may ask "Have you finished?" and record that you did.</li></ul></div>

<div class="card"><h2>Which features are expected?</h2>
<p><b>Expected from about age 5</b> (present in more than 85% of drawings in the Koppitz data for ages 5 to 12): head, eyes, nose, mouth, trunk, legs, and nearly always arms and feet.</p>

<div class="card"><h2>Use of space, placement and assembly by age</h2>
<p><b>Size.</b> I found no age-normed tables for figure height on a page. Koppitz suggested treating figures of 5 cm or less, or 23 cm or more, as unusual. Younger children tend to draw bigger figures and use more of the page, and size falls with age: figure size was reduced between ages 7 and 9 in a longitudinal study, and the space given to people in drawings decreased with age in a large cross-cultural sample.</p>
<p><b>Running out of room.</b> Children usually draw the head first, and in a study of 3 to 10 year olds, younger children often left too little room for the body. Cramped or cut-off figures are therefore common in younger children.</p>
